<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#060912"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="softGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e3a8a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Subtle Acoustic Ambient Disc -->
  <circle cx="256" cy="220" r="140" fill="url(#softGlow)"/>

  <!-- Minimalist Studio Acoustic Waveform -->
  <rect x="136" y="180" width="16" height="80" rx="8" fill="#64748b" opacity="0.6"/>
  <rect x="176" y="140" width="16" height="160" rx="8" fill="#94a3b8" opacity="0.8"/>
  <rect x="216" y="110" width="16" height="220" rx="8" fill="url(#accentBlue)" filter="url(#subtleShadow)"/>
  <rect x="256" y="80" width="18" height="280" rx="9" fill="#ffffff" filter="url(#subtleShadow)"/>
  <rect x="296" y="110" width="16" height="220" rx="8" fill="url(#accentBlue)" filter="url(#subtleShadow)"/>
  <rect x="336" y="140" width="16" height="160" rx="8" fill="#94a3b8" opacity="0.8"/>
  <rect x="376" y="180" width="16" height="80" rx="8" fill="#64748b" opacity="0.6"/>

  <!-- Brand Typography: teachme.ai -->
  <text x="256" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    teachme<tspan fill="#38bdf8">.ai</tspan>
  </text>
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="3">
    ACOUSTIC SPOKEN STUDIO
  </text>
</svg>
